name: Nezora Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ["Generate Cargo Lockfile"]
    types: [completed]
    branches: [main]

jobs:
  test:
    # GitHub suppresses push-triggered workflows created with GITHUB_TOKEN.
    # This workflow_run trigger starts CI after the lockfile workflow finishes.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable

      - name: Build all targets
        run: cargo build --release --locked

      - name: Build solo miner binary
        run: cargo build --release --locked --bin mine

      - name: Check solo miner CLI
        run: cargo run --release --locked --bin mine -- --help

      - name: Build wallet binary
        run: cargo build --release --locked --bin wallet

      - name: Check wallet CLI
        run: cargo run --release --locked --bin wallet -- --help

      - name: Test wallet create and info using temporary key
        shell: bash
        run: |
          set -euo pipefail
          WALLET_KEY="$RUNNER_TEMP/nezora-ci-wallet.key"
          cargo run --release --locked --bin wallet -- create --key "$WALLET_KEY"
          test -f "$WALLET_KEY"
          cargo run --release --locked --bin wallet -- info --key "$WALLET_KEY"
          rm -f "$WALLET_KEY"

      - name: Test
        run: cargo test --release --locked

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit
