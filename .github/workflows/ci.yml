name: Nezora Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test --release
      - name: Clippy
        run: cargo clippy --all-targets --all-features
      - name: Format check
        run: cargo fmt --all -- --check
